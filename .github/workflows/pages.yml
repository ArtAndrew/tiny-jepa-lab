name: Publish ORBIT and verify leaderboard

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled, transferred]
  workflow_dispatch:

permissions: {}

# Serialize complete rebuilds; a newer event will rebuild from current issues.
concurrency:
  group: orbit-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ArtAndrew/tiny-jepa-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build browser pages and shared rules
        run: python3 scripts/build_site.py
      - name: Test game integration and replay validation
        run: node --test scripts/test_*.cjs
      - name: Recompute public scores from submitted actions
        run: node scripts/build_leaderboard.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Embed verified snapshot in all languages
        run: python3 scripts/build_site.py --leaderboard docs/assets/leaderboard.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
